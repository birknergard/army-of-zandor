<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gathering Army</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="scripts/shop.js" type="module"></script>
</head>
<body>
    <header class="header">
        <h1 class="header__title">ArmiesOfZondor</h1>
        <aside class="header__resources">
            <div class="header__resource">
                <img class="header__resource__icon" src="images/metal.png" alt="metal icon">
                <p class="header__resource__text header__resource__text--metal" id="metal_count">0</p>   
            </div>

            <div class="header__resource">
                <img class="header__resource__icon" src="images/gold-coin.png" alt="gold icon">
                <p class="header__resource__text header__resource__text--gold" id="gold-coin_count">0</p>   
            </div>

            <div class="header__resource">
                <img class="header__resource__icon" src="images/wood.png" alt="wood icon">
                <p class="header__resource__text header__resource__text--wood" id="wood_count">0</p>
            </div>
        </aside>
        <nav class="header__nav-bar">
            <a class="header__nav-bar__button header__nav-bar__button--shop header__nav-bar__button--active" href="shop.html">Shop</a>
            <a class="header__nav-bar__button header__nav-bar__button--resources" href="resources.html">Resources</a>
            <a class="header__nav-bar__button header__nav-bar__button--inventory " href="inventory.html">Inventory</a>
        </nav>
    </header>



    <main class="shop">
        <h1 class="shop__description">Gather your army!</h1>
        <section class="shop__section">
            <h2 class="shop__section__titles">Warriors</h2>
            <div class="shop__grid shop__grid--warriors">
                <!-- Warriors are printed here from .js -->
            </div>
        </section>
        <section class="shop__section">
            <h2 class="shop__titles">Animals</h2>
            <div class="shop__grid shop__grid--animals">
                <!-- Animals are printed here from .js -->
            </div>
        </section>
        <section class="shop__section">
            <h2 class="shop__titles">War Machines</h2>
            <div class="shop__grid shop__grid--machines">
                <!-- Machines are printed here from .js -->
            </div>
        </section>
    </main>
    
</body>
</html>
