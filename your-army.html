<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Army</title>
    <script defer src="scripts/your-army.js" type="module"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="header">
        <h1 class="title">ArmiesOfZondor</h1>
        <nav class="nav-bar">
            <a class="nav-bar_button" href="gathering-army.html">Kjøp</a>
            <a class="nav-bar_button" href="getting-resources.html">Ressurser</a>
            <a class="nav-bar_button" href="your-army.html">Din arme</a>
        </nav>
    </header>

    <section class="user_resources">
        <div class="icon_container">
                <img class="resource_icon" src="images/metal.png" alt="metal icon">
                <p id="metal_count" class="resource_count_text">0</p>   
            </div>

            <div class="icon_container">
                <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                <p id="gold-coin_count" class="resource_count_text">0</p>
            </div>

            <div class="icon_container">
                <img class="resource_icon" src="images/wood.png" alt="wood icon">
                <p id="wood_count" class="resource_count_text">0</p>
            </div>

    </section>

    <main class="your-army">

        <h1 class="your-army_title">Your Army</h1>
        
        <section>
            <h2 class="your-army_sub-header">Warriors</h2>
            <article class="your-army_warriors">
                <!-- Testobject-->
                <img class="warrior" src="images/warrior-1.jpg" alt="">
            </article>
        </section>

        <section>
            <h2 class="your-army_sub-header">Other</h2>
            <article class="your-army_other">
                <!-- Testobject-->
                <img class="other" src="images/elephant.png" alt="">
            </article>
        </section>       
    </main>


</body>
</html>
