<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Army</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="scripts/inventory.js" type="module"></script>
</head>
<body>
    <header class="header">
        <h1 class="header__title">ArmiesOfZondor</h1>
        <aside class="header__resources">
            <div class="header__resource">
                <img class="header__resource__icon" src="images/metal.png" alt="metal icon">
                <p class="header__resource__text header__resource__text--metal" id="metal_count">0</p>   
            </div>

            <div class="header__resource">
                <img class="header__resource__icon" src="images/gold-coin.png" alt="gold icon">
                <p class="header__resource__text header__resource__text--gold" id="gold-coin_count">0</p>   
            </div>

            <div class="header__resource">
                <img class="header__resource__icon" src="images/wood.png" alt="wood icon">
                <p class="header__resource__text header__resource__text--wood" id="wood_count">0</p>
            </div>
        </aside>
        <nav class="header__nav-bar">
            <a class="header__nav-bar__button header__nav-bar__button--shop" href="shop.html">Shop</a>
            <a class="header__nav-bar__button header__nav-bar__button--resources" href="resources.html">Resources</a>
            <a class="header__nav-bar__button header__nav-bar__button--inventory header__nav-bar__button--active" href="inventory.html">Inventory</a>
        </nav>
    </header>

    <main class="inventory">
        <h1 class="inventory__description">Your Army</h1>
        <section class="inventory__section">
            <h2 class="inventory__sub-header">Warriors</h2>
            <div class="inventory__grid inventory__grid--warriors" id="warrior-inventory">
                <p>You have no warriors.</p>

            <!-- Users warriors are printed here -->
            </div>
        </section>

        <section class="inventory__section">
            <h2 class="inventory__sub-header">Other</h2>
            <div class="inventory__grid inventory__grid--others" id="other-inventory">
                <p>You have no animals nor machines.</p>
                <!-- Users machines and animals are printed here -->
            </div>
        </section>       
    </main>
</body>
</html>
