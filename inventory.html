<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Army</title>
    <link rel="stylesheet" href="css/main.css">
    <script defer src="scripts/inventory.js" type="module"></script>
</head>
<body>
    <header class="header">
        <h1 class="title">ArmiesOfZondor</h1>
        <aside class="user_resources">
            <div class="icon_container">
                <img class="resource_icon" src="images/metal.png" alt="metal icon">
                <p id="metal_count" class="resource_count_text">0</p>   
            </div>

            <div class="icon_container">
                <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                <p id="gold-coin_count" class="resource_count_text">0</p>
            </div>

            <div class="icon_container">
                <img class="resource_icon" src="images/wood.png" alt="wood icon">
                <p id="wood_count" class="resource_count_text">0</p>
            </div>
        </aside>
        <nav class="nav-bar">
            <a class="nav-bar_button nav_inventory" href="shop.html">Shop</a>
            <a class="nav-bar_button nav_resources" href="resources.html">Resources</a>
            <a class="nav-bar_button nav_inventory" href="inventory.html">Inventory</a>
        </nav>
    </header>

    <main class="inventory">
        <h1 class="inventory_title">Your Army</h1>
        <section>
            <h2 class="inventory_sub-header">Warriors</h2>
            <div id="warrior-inventory" class="inventory_warriors">
            <!-- Users warriors are printed here -->
            </div>
        </section>

        <section>
            <h2 class="inventory_sub-header">Other</h2>
            <div id="other-inventory" class="inventory_others">
                <!-- Users machines and animals are printed here -->
            </div>
        </section>       
    </main>
</body>
</html>
