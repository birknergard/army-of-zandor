<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="scripts/gathering-army.js" type="module"></script>
    <link rel="stylesheet" href="css/main.css">
    <title>Gathering Army</title>

</head>
<body>
    <header class="header">
        <h1 class="title">ArmiesOfZondor</h1>
        <nav class="nav-bar">
            <a class="nav-bar_button" href="gathering-army.html">Kjøp</a>
            <a class="nav-bar_button" href="getting-resources.html">Ressurser</a>
            <a class="nav-bar_button" href="your-army.html">Din arme</a>
        </nav>
    </header>

    <main class="shop">
        <section class="icons">
            <div class="icon_container">
                <img class="resource_icon" src="images/metal.png" alt="metal icon">
                <p id="metal_count" class="resource_count_text">0</p>   
            </div>

            <div class="icon_container">
                <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                <p id="gold-coin_count" class="resource_count_text">0</p>
            </div>

            <div class="icon_container">
                <img class="resource_icon" src="images/wood.png" alt="wood icon">
                <p id="wood_count" class="resource_count_text">0</p>
            </div>
              
        </section>

        <section class="warriors_grid">
            
            <figure class="warrior_item">
                <h2 class="warrior_name">Lass</h2>  
                <img class="warrior_image" src="./images/warrior-1.jpg" alt="image of warrior"> 
                <button>
                    <div class="icon_container">
                        <p class="resource_count_text">150</p>
                        <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                    </div>
                </button>
            </figure>

            <figure class="warrior_item">
                <h2 class="warrior_name">Giant</h2>  
                <img class="warrior_image" src="./images/warrior-2.jpg" alt="image of warrior"> 
                <button>
                    <div class="icon_container">
                        <p class="resource_count_text">300</p>
                        <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                    </div>
                </button>
            </figure>

            <figure class="warrior_item">
                <h2 class="warrior_name">Mercenary</h2>  
                <img class="warrior_image" src="./images/warrior-3.jpg" alt="image of warrior"> 
                <button>
                    <div class="icon_container">
                        <p class="resource_count_text">200</p>
                        <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                    </div>
                </button>
            </figure>

            <figure class="warrior_item">
                <h2 class="warrior_name">Bandit</h2>  
                <img class="warrior_image" src="./images/warrior-4.jpg" alt="image of warrior"> 
                <button>
                    <div class="icon_container">
                        <p class="resource_count_text">100</p>
                        <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                    </div>
                </button>
            </figure>
            <figure class="warrior_item">
                <h2 class="warrior_name">Viking</h2>  
                <img class="warrior_image" src="./images/warrior-5.jpg" alt="image of warrior"> 
                <button>
                    <div class="icon_container">
                        <p class="resource_count_text">200</p>
                        <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                    </div>
                </button>
            </figure>
            <figure class="warrior_item">
                <h2 class="warrior_name">Berserker</h2>  
                <img class="warrior_image" src="./images/warrior-6.jpg" alt="image of warrior"> 
                <button>
                    <div class="icon_container">
                        <p class="resource_count_text">350</p>
                        <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
                    </div>
                </button>
            </figure>
             
        </section>
    
    </main>
    
</body>
</html>
