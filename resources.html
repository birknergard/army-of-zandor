<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Resources</title>
    <link rel="stylesheet" href="css/main.css">
    <script defer src="scripts/resources.js" type="module"></script>
</head>
<body>
    <header class="header">
        <h1 class="header__title">ArmiesOfZondor</h1>
        <aside class="header__resources">
            <div class="header__resource">
                <img class="header__resource__icon" src="images/metal.png" alt="metal icon">
                <p class="header__resource__text header__resource__text--metal" id="metal_count">0</p>   
            </div>

            <div class="header__resource">
                <img class="header__resource__icon" src="images/gold-coin.png" alt="gold icon">
                <p class="header__resource__text header__resource__text--gold" id="gold_icon">0</p>   
            </div>

            <div class="header__resource">
                <img class="header__resource__icon" src="images/wood.png" alt="wood icon">
                <p class="header__resource__text header__resource__text--wood" id="wood_count">0</p>
            </div>
        </aside>
        <nav class="header__nav-bar">
            <a class="header__nav-bar__button header__nav-bar__button--shop" href="shop.html">Shop</a>
            <a class="header__nav-bar__button header__nav-bar__button--resources header__nav-bar__button--active" href="resources.html">Resources</a>
            <a class="header__nav-bar__button header__nav-bar__button--inventory " href="inventory.html">Inventory</a>
        </nav>
    </header>

    <main class="resources">
        <h1 class="resources__description">Click the two images to gather resources!</h1>
        <section class="resources__places">
            <img class="resources__image resources__image--mines" id="mines-image" src="images/mines-of-thiartha.jpg">
            <img class="resources__image resources__image--woods" id="woods-image" src="images/woods-of-ghalduz.png">
        </section>
    </main>
</body>
</html>
