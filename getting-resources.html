<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Resources</title>
    <script defer src="scripts/getting-resources.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="getting-resources">
    <header class="nav-bar">
        <h1 class="nav-bar_title">Armies of Zondor</h1>
        <input class="nav-bar_button" type="button" value="Hjem" href="gathering-army.html">
        <input class="nav-bar_button" type="button" value="Få ressurser" href="getting-resources.html">

    </header>
    <main>
        <section class="icons">
            <img id="gold-coin_icon" class="resource_icon" src="images/gold-coin.png" alt="gold icon">
            <p id="gold-coin_count" class="resource-count-text">0</p>
                
            <img class="resource_icon" src="images/wood.png" alt="wood icon">
            <p id="wood_count">0</p>

        </section>
        <section class="places">
            <img id="mines-image" class="resource_image mines" src="images/mines-of-thiartha.jpg">
            <img id="woods-image" class="resource_image woods" src="images/woods-of-ghalduz.png">
